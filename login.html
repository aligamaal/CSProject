        async function loadFriendsPage() {
            // Load pending requests
            const pendingContainer = document.getElementById('pendingRequests');
            if (pendingContainer) {
                if (receivedRequests.length > 0) {
                    pendingContainer.innerHTML = '';
                    receivedRequests.forEach(request => {
                        const card = document.createElement('div');
                        card.className = 'friend-card';
                        card.innerHTML = `
                            <img src="${request.avatar || `https://via.placeholder.com/150/1DB954/FFFFFF?text=${request.username.charAt(0)}`}" 
                                 alt="${request.username}">
                            <div class="friend-card-info">
                                <strong>${request.username}</strong>
                                <small>Wants to be your friend</small>
                            </div>
                            <div>
                                <button class="btn-accept" onclick="acceptFriendRequest('${request.username}')">Accept</button>
                                <button class="btn-decline" onclick="rejectFriendRequest('${request.username}')">Decline</button>
                            </div>
                        `;
                        pendingContainer.appendChild(card);
                    });
                } else {
                    pendingContainer.innerHTML = '<div class="empty-state">No pending friend requests</div>';
                }
            }
            
            // Load friends list with mutual friends functionality
            const friendsContainer = document.getElementById('friendsListMain');
            if (friendsContainer) {
                if (friends.length > 0) {
                    friendsContainer.innerHTML = '';
                    friends.forEach(friendUsername => {
                        const card = createFriendCardWithMutual(friendUsername, true);
                        friendsContainer.appendChild(card);
                    });
                } else {
                    friendsContainer.innerHTML = '<div class="empty-state">You haven\'t added any friends yet</div>';
                }
            }
        }

        // Enhanced function to get mutual friends
        async function getMutualFriends(friendUsername) {
            try {
                const response = await fetch(`http://localhost:18080/api/friends/mutual/${friendUsername}`, {
                    headers: {
                        'Authorization': sessionStorage.getItem('authToken')
                    }
                });
                
                const data = await response.json();
                return data.success ? data.mutualFriends : [];
            } catch (error) {
                console.error('Error getting mutual friends:', error);
                return [];
            }
        }

        // Create friend card with mutual friends dropdown
        function createFriendCardWithMutual(friendUsername, showRemoveButton = false) {
            const card = document.createElement('div');
            card.className = 'friend-card friend-card-enhanced';
            
            const mainContent = document.createElement('div');
            mainContent.className = 'friend-card-main';
            
            mainContent.innerHTML = `
                <img src="https://via.placeholder.com/150/1DB954/FFFFFF?text=${friendUsername.charAt(0)}" 
                     alt="${friendUsername}">
                <div class="friend-card-info">
                    <strong>${friendUsername}</strong>
                    <small>Friend</small>
                </div>
                <div class="friend-actions">
                    ${showRemoveButton ? `<button class="btn-decline" onclick="removeFriend('${friendUsername}')">Remove</button>` : ''}
                </div>
            `;
            
            // Create mutual friends dropdown
            const mutualDropdown = document.createElement('div');
            mutualDropdown.className = 'mutual-dropdown';
            
            const mutualToggle = document.createElement('button');
            mutualToggle.className = 'mutual-toggle';
            mutualToggle.innerHTML = '<span class="loading-spinner"></span> Loading mutual friends...';
            
            const mutualList = document.createElement('div');
            mutualList.className = 'mutual-list';
            
            mutualDropdown.appendChild(mutualToggle);
            mutualDropdown.appendChild(mutualList);
            
            card.appendChild(mainContent);
            card.appendChild(mutualDropdown);
            
            // Load mutual friends immediately
            loadMutualFriendsForCard(friendUsername, mutualToggle, mutualList);
            
            return card;
        }

        // Load mutual friends for a specific card
        async function loadMutualFriendsForCard(friendUsername, toggleButton, listContainer) {
            try {
                const mutualFriends = await getMutualFriends(friendUsername);
                
                // Update toggle button
                toggleButton.className = 'mutual-toggle';
                if (mutualFriends.length > 0) {
                    toggleButton.innerHTML = `Mutual Friends <span class="mutual-count">${mutualFriends.length}</span>`;
                } else {
                    toggleButton.innerHTML = 'No Mutual Friends';
                    toggleButton.style.opacity = '0.6';
                    toggleButton.style.cursor = 'default';
                    return; // Don't add click handler if no mutual friends
                }
                
                // Populate list container
                if (mutualFriends.length > 0) {
                    const ul = document.createElement('ul');
                    mutualFriends.forEach(mutualFriend => {
                        const li = document.createElement('li');
                        li.textContent = mutualFriend;
                        ul.appendChild(li);
                    });
                    listContainer.appendChild(ul);
                } else {
                    listContainer.innerHTML = '<div class="no-mutual-friends">No mutual friends found</div>';
                }
                
                // Add click handler to toggle dropdown
                toggleButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isOpen = listContainer.classList.contains('show');
                    
                    // Close all other dropdowns
                    document.querySelectorAll('.mutual-list.show').forEach(list => {
                        list.classList.remove('show');
                    });
                    document.querySelectorAll('.mutual-toggle.open').forEach(toggle => {
                        toggle.classList.remove('open');
                    });
                    
                    // Toggle current dropdown
                    if (!isOpen && mutualFriends.length > 0) {
                        listContainer.classList.add('show');
                        toggleButton.classList.add('open');
                    }
                });
                
            } catch (error) {
                console.error('Error loading mutual friends for card:', error);
                toggleButton.className = 'mutual-toggle';
                toggleButton.innerHTML = 'Error loading';
                toggleButton.style.opacity = '0.6';
                toggleButton.style.cursor = 'default';
            }
        }

        // Enhanced loadFriendsSidebar with mutual friends
        async function loadFriendsSidebar() {
            const container = document.getElementById('friendsList');
            if (!container) return;
            
            if (friends.length > 0) {
                container.innerHTML = '';
                friends.forEach(friendUsername => {
                    const card = createFriendCardWithMutual(friendUsername, false);
                    container.appendChild(card);
                });
            } else {
                container.innerHTML = '<p style="color:#888;">You have no friends yet</p>';
            }
        }

        // Enhanced Friend Suggestions with Mutual Friends Count
        async function loadFriendSuggestions() {
            const container = document.getElementById('friendSuggestions');
            if (!container) return;
            
            // Show loading state
            container.innerHTML = `
                <div class="suggestion-loading">
                    <div class="loading-spinner"></div>
                    Loading suggestions...
                </div>
            `;
            
            try {
                const response = await fetch('http://localhost:18080/api/friends/suggestions', {
                    headers: {
                        'Authorization': sessionStorage.getItem('authToken')
                    }
                });
                
                const data = await response.json();
                
                if (data.success && data.suggestions && data.suggestions.length > 0) {
                    container.innerHTML = '';
                    
                    // Create suggestion cards with mutual friend info
                    data.suggestions.forEach((suggestion, index) => {
                        const card = createSuggestionCard(suggestion, index + 1);
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<div class="no-suggestions">No friend suggestions available</div>';
                }
            } catch (error) {
                console.error('Error loading friend suggestions:', error);
                container.innerHTML = '<div class="no-suggestions">Error loading suggestions</div>';
            }
        }

        // Create enhanced suggestion card with mutual friends info
        function createSuggestionCard(suggestion, rank) {
            const card = document.createElement('div');
            card.className = 'suggestion-card';
            card.style.position = 'relative';
            
            // Add ranking indicator
            const rankBadge = document.createElement('div');
            rankBadge.className = `suggestion-rank rank-${rank}`;
            rankBadge.textContent = rank;
            card.appendChild(rankBadge);
            
            // Main suggestion content
            const mainContent = document.createElement('div');
            mainContent.className = 'suggestion-main';
            
            mainContent.innerHTML = `
                <img src="${suggestion.avatar}" alt="${suggestion.username}">
                <div class="suggestion-info">
                    <strong>${suggestion.username}</strong>
                </div>
            `;
            
            // Mutual friends info section
            const mutualInfo = document.createElement('div');
            mutualInfo.className = 'suggestion-mutual-info';
            
            if (suggestion.mutualCount > 0) {
                const mutualBadge = document.createElement('div');
                mutualBadge.className = 'mutual-count-badge';
                mutualBadge.textContent = `${suggestion.mutualCount} mutual`;
                
                const mutualPreview = document.createElement('div');
                mutualPreview.className = 'mutual-preview';
                
                if (suggestion.mutualFriends && suggestion.mutualFriends.length > 0) {
                    const previewNames = suggestion.mutualFriends.slice(0, 2);
                    let previewText = `via ${previewNames.join(', ')}`;
                    if (suggestion.mutualFriends.length > 2) {
                        previewText += ` +${suggestion.mutualFriends.length - 2} more`;
                    }
                    mutualPreview.textContent = previewText;
                }
                
                mutualInfo.appendChild(mutualBadge);
                mutualInfo.appendChild(mutualPreview);
            } else {
                const noMutualText = document.createElement('div');
                noMutualText.className = 'mutual-preview';
                noMutualText.textContent = 'Suggested for you';
                mutualInfo.appendChild(noMutualText);
            }
            
            // Check if friend request was already sent
            const hasSentRequest = sentRequests.includes(suggestion.username);
            
            // Action buttons
            const actions = document.createElement('div');
            actions.className = 'suggestion-actions';
            
            // Create main action button (Add Friend or Cancel Request)
            const mainActionBtn = document.createElement('button');
            mainActionBtn.className = hasSentRequest ? 'add-friend-btn pending' : 'add-friend-btn';
            mainActionBtn.textContent = hasSentRequest ? 'Cancel Request' : 'Add Friend';
            mainActionBtn.onclick = () => {
                if (hasSentRequest) {
                    cancelFriendRequest(suggestion.username);
                } else {
                    sendFriendRequest(suggestion.username);
                }
            };
            
            // Style the cancel button differently
            if (hasSentRequest) {
                mainActionBtn.style.background = '#666';
                mainActionBtn.style.color = '#fff';
            }
            
            actions.appendChild(mainActionBtn);
            
            // Add "View Mutual" button if there are mutual friends
            if (suggestion.mutualCount > 0 && suggestion.mutualFriends && suggestion.mutualFriends.length > 0) {
                const viewMutualBtn = document.createElement('button');
                viewMutualBtn.className = 'view-mutual-btn';
                viewMutualBtn.textContent = 'View';
                
                // Create dropdown for mutual friends
                const mutualDropdown = document.createElement('div');
                mutualDropdown.className = 'suggestion-mutual-dropdown';
                
                const mutualList = document.createElement('div');
                mutualList.className = 'suggestion-mutual-list';
                
                // Add a header to the dropdown
                const header = document.createElement('div');
                header.style.cssText = `
                    font-weight: bold;
                    color: #1DB954;
                    margin-bottom: 8px;
                    font-size: 12px;
                    text-align: center;
                    border-bottom: 1px solid #333;
                    padding-bottom: 6px;
                `;
                header.textContent = `Mutual Friends (${suggestion.mutualCount})`;
                mutualList.appendChild(header);
                
                const ul = document.createElement('ul');
                suggestion.mutualFriends.forEach(mutualFriend => {
                    const li = document.createElement('li');
                    li.textContent = mutualFriend;
                    ul.appendChild(li);
                });
                mutualList.appendChild(ul);
                
                mutualDropdown.appendChild(mutualList);
                actions.appendChild(mutualDropdown);
                
                // Add click handler for view button
                viewMutualBtn.onclick = (e) => {
                    e.stopPropagation();
                    const isOpen = mutualList.classList.contains('show');
                    
                    // Close all other suggestion dropdowns
                    document.querySelectorAll('.suggestion-mutual-list.show').forEach(list => {
                        list.classList.remove('show');
                    });
                    
                    // Toggle current dropdown
                    if (!isOpen) {
                        mutualList.classList.add('show');
                    }
                };
                
                actions.appendChild(viewMutualBtn);
            }
            
            // Assemble the card
            card.appendChild(mainContent);
            card.appendChild(mutualInfo);
            card.appendChild(actions);
            
            return card;
        }

            sessionStorage.clear();
