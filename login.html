<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundSpace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
        }

        /* Header Styles */
        .header {
            background-color: #000;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .logo::before {
            content: '🎵';
            font-size: 1.5rem;
        }

        .logo span {
            color: #1DB954;
        }

        .search-container {
            flex: 0 1 500px;
            position: relative;
        }

        .search-bar {
            width: 100%;
            padding: 0.75rem 3rem 0.75rem 1rem;
            background-color: #2a2a2a;
            border: none;
            border-radius: 50px;
            color: #fff;
            font-size: 0.9rem;
        }

        .search-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #1DB954;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-btn:hover {
            background-color: #1ed760;
        }

        /* User menu */
        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Main Layout */
        .main-container {
            display: flex;
            height: calc(100vh - 73px);
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: #000;
            padding: 2rem 1rem;
            border-right: 1px solid #333;
        }

        .menu-section {
            margin-bottom: 2rem;
        }

        .menu-title {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            color: #888;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .menu-item:hover {
            color: #fff;
            background-color: #1a1a1a;
        }

        .menu-item.active {
            color: #1DB954;
        }

        .menu-item::before {
            font-size: 1.2rem;
        }

        .menu-item:nth-child(1)::before { content: '🏠'; }
        .menu-item:nth-child(2)::before { content: '👥'; }
        .menu-item:nth-child(3)::before { content: '🔔'; }
        .menu-item:nth-child(4)::before { content: '⚙️'; }

        /* Content Area */
        .content {
            flex: 1;
            background-color: #1a1a1a;
            padding: 2rem;
            overflow-y: auto;
        }

        /* Post Creation */
        .post-creation {
            background-color: #2a2a2a;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .post-input {
            flex: 1;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 25px;
            padding: 0.75rem 1.5rem;
            color: #fff;
            font-size: 1rem;
            resize: none;
            font-family: inherit;
        }

        .post-btn {
            background-color: #1DB954;
            color: #000;
            border: none;
            border-radius: 25px;
            padding: 0.75rem 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .post-btn:hover {
            background-color: #1ed760;
        }

        /* Right Sidebar */
        .right-sidebar {
            width: 300px;
            background-color: #000;
            padding: 2rem 1rem;
            border-left: 1px solid #333;
        }

        .friends-section {
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 0.9rem;
            color: #fff;
            margin-bottom: 1rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Login/Signup Styles */
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        }

        .auth-box {
            background-color: #000;
            border-radius: 10px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: #888;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: #ccc;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 5px;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #1DB954;
        }

        .auth-btn {
            width: 100%;
            padding: 0.75rem;
            background-color: #1DB954;
            color: #000;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .auth-btn:hover {
            background-color: #1ed760;
        }

        .auth-switch {
            text-align: center;
            margin-top: 1.5rem;
            color: #888;
        }

        .auth-switch a {
            color: #1DB954;
            text-decoration: none;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        /* Error/Success Messages */
        .message {
            padding: 0.75rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .error {
            background-color: #ff4444;
            color: #fff;
        }

        .success {
            background-color: #1DB954;
            color: #000;
        }

        /* Users List */
        .users-list {
            display: grid;
            gap: 1rem;
        }

        .user-card {
            background-color: #2a2a2a;
            border-radius: 10px;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: background-color 0.2s;
        }

        .user-card:hover {
            background-color: #333;
        }

        .user-avatar-small {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .user-status {
            font-size: 0.85rem;
            color: #888;
        }

        .friend-btn {
            padding: 0.5rem 1rem;
            background-color: #1DB954;
            color: #000;
            border: none;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .friend-btn:hover {
            background-color: #1ed760;
        }

        .friend-btn.pending {
            background-color: #333;
            color: #888;
        }

        .friend-btn.friend {
            background-color: transparent;
            color: #1DB954;
            border: 1px solid #1DB954;
        }

        /* Hide elements initially */
        .dashboard-content {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Login/Signup Container -->
    <div id="authContainer" class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>🎵 <span style="color: #1DB954;">Sound</span>Space</h1>
                <p id="authTitle">Sign in to continue</p>
            </div>
            
            <div id="message"></div>
            
            <form id="authForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" required>
                </div>
                
                <button type="submit" class="auth-btn" id="authBtn">Sign In</button>
            </form>
            
            <div class="auth-switch">
                <span id="authSwitchText">Don't have an account?</span>
                <a href="#" id="authSwitchLink">Sign up</a>
            </div>
        </div>
    </div>

    <!-- Dashboard Content -->
    <div id="dashboardContent" class="dashboard-content">
        <!-- Header -->
        <header class="header">
            <div class="logo">SoundSpace</div>
            <div class="search-container">
                <input type="text" class="search-bar" placeholder="Search for users..." id="userSearchInput">
                <button class="search-btn" onclick="searchUsers()">🔍</button>
            </div>
            <div class="user-menu">
                <span id="currentUsername"></span>
                <img id="userAvatar" class="user-avatar" src="" alt="User">
                <button onclick="logout()" style="background: none; border: none; color: #888; cursor: pointer;">Logout</button>
            </div>
        </header>

        <!-- Main Container -->
        <div class="main-container">
            <!-- Left Sidebar -->
            <aside class="sidebar">
                <nav class="menu-section">
                    <div class="menu-title">Menu</div>
                    <a href="#" class="menu-item active" onclick="showHome()">Home</a>
                    <a href="#" class="menu-item" onclick="showFriends()">Friends</a>
                    <a href="#" class="menu-item">Notifications</a>
                    <a href="#" class="menu-item">Settings</a>
                </nav>
                
                <div class="menu-section">
                    <div class="menu-title">Friend Suggestions</div>
                    <div id="friendSuggestions"></div>
                </div>
            </aside>

            <!-- Content Area -->
            <main class="content" id="mainContent">
                <div class="post-creation">
                    <img id="postUserAvatar" class="user-avatar" src="" alt="You">
                    <textarea class="post-input" placeholder="What's on your mind? Share a song or thought..." rows="1"></textarea>
                    <button class="post-btn">Post</button>
                </div>
                
                <div id="contentArea">
                    <!-- Dynamic content will be loaded here -->
                </div>
            </main>

            <!-- Right Sidebar -->
            <aside class="right-sidebar">
                <div class="friends-section">
                    <h3 class="section-title">Your Friends</h3>
                    <div id="friendsList"></div>
                </div>
                
                <div class="friends-section">
                    <h3 class="section-title">Mutual Connections</h3>
                    <div id="mutualConnections"></div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        let authToken = localStorage.getItem('authToken');
        let currentUser = localStorage.getItem('username');
        let isLogin = true;

        // Check if user is already logged in
        if (authToken && currentUser) {
            showDashboard();
        }

        // Auth form elements
        const authForm = document.getElementById('authForm');
        const authTitle = document.getElementById('authTitle');
        const authBtn = document.getElementById('authBtn');
        const authSwitchText = document.getElementById('authSwitchText');
        const authSwitchLink = document.getElementById('authSwitchLink');
        const messageDiv = document.getElementById('message');

        // Toggle between login and signup
        authSwitchLink.addEventListener('click', (e) => {
            e.preventDefault();
            isLogin = !isLogin;
            
            if (isLogin) {
                authTitle.textContent = 'Sign in to continue';
                authBtn.textContent = 'Sign In';
                authSwitchText.textContent = "Don't have an account?";
                authSwitchLink.textContent = 'Sign up';
            } else {
                authTitle.textContent = 'Create your account';
                authBtn.textContent = 'Sign Up';
                authSwitchText.textContent = 'Already have an account?';
                authSwitchLink.textContent = 'Sign in';
            }
            
            messageDiv.innerHTML = '';
        });

        // Handle auth form submission
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const endpoint = isLogin ? '/api/login' : '/api/signup';
            
            try {
                const response = await fetch(`http://localhost:18080${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('userAvatar', data.avatar);
                    showMessage('Success! Redirecting...', 'success');
                    setTimeout(() => showDashboard(), 1000);
                } else {
                    showMessage(data.message || 'Authentication failed', 'error');
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'error');
                console.error('Auth error:', error);
            }
        });

        function showMessage(message, type) {
            messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
        }

        function showDashboard() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('dashboardContent').style.display = 'block';
            
            // Set user info
            document.getElementById('currentUsername').textContent = localStorage.getItem('username');
            const avatarUrl = localStorage.getItem('userAvatar');
            document.getElementById('userAvatar').src = avatarUrl;
            document.getElementById('postUserAvatar').src = avatarUrl;
            
            // Load initial data
            loadFriends();
            loadFriendSuggestions();
            loadAllUsers();
        }

        async function searchUsers() {
            const searchInput = document.getElementById('userSearchInput').value.trim();
            
            if (!searchInput) {
                loadAllUsers();
                return;
            }
            
            try {
                const response = await fetch(`http://localhost:18080/api/users/search/${searchInput}`, {
                    headers: {
                        'Authorization': localStorage.getItem('authToken')
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayUsers(data.users);
                }
            } catch (error) {
                console.error('Search error:', error);
            }
        }

    async function loadAllUsers() {
    try {
        // Get all users
        const response = await fetch('http://localhost:18080/api/users', {
            headers: {
                'Authorization': localStorage.getItem('authToken')
            }
        });
        
        const data = await response.json();
        
        if (data.success) {
            let pendingRequests = [];
            let sentRequests = [];
            
            // Get pending friend requests (received)
            try {
                const pendingResponse = await fetch('http://localhost:18080/api/friend-requests/pending', {
                    headers: { 'Authorization': localStorage.getItem('authToken') }
                });
                
                const pendingData = await pendingResponse.json();
                if (pendingData.success && pendingData.requests) {
                    pendingRequests = pendingData.requests;
                }
            } catch (error) {
                console.error('Error fetching pending requests:', error);
            }
            
            // Get sent friend requests
            try {
                const sentResponse = await fetch('http://localhost:18080/api/friend-requests/sent', {
                    headers: { 'Authorization': localStorage.getItem('authToken') }
                });
                
                const sentData = await sentResponse.json();
                if (sentData.success && sentData.requests) {
                    sentRequests = sentData.requests;
                }
            } catch (error) {
                console.error('Error fetching sent requests:', error);
            }
            
            // Display users with correct status
            displayUsers(data.users, pendingRequests, sentRequests);
        }
    } catch (error) {
        console.error('Load users error:', error);
        alert('Failed to load users. Please check console for details.');
    }
}

    function displayUsers(users, pendingRequests = [], sentRequests = []) {
    const contentArea = document.getElementById('contentArea');
    contentArea.innerHTML = ''; // Clear previous content
    
    if (!users || users.length === 0) {
        contentArea.innerHTML = '<p style="color: #888; text-align: center;">No users found.</p>';
        return;
    }
    
    // Create container
    const container = document.createElement('div');
    container.className = 'users-list';
    
    // Extract usernames from pending requests if they're objects
    const pendingUsernames = pendingRequests.map(req => 
        typeof req === 'object' ? req.username : req
    );
    
    // 1. Show pending requests section
    if (pendingRequests.length > 0) {
        const pendingHeader = document.createElement('h3');
        pendingHeader.style.color = '#1DB954';
        pendingHeader.style.marginBottom = '1rem';
        pendingHeader.textContent = 'Pending Friend Requests';
        container.appendChild(pendingHeader);
        
        pendingRequests.forEach(request => {
            const username = typeof request === 'object' ? request.username : request;
            const avatar = typeof request === 'object' ? request.avatar : 
                `https://via.placeholder.com/150/1DB954/FFFFFF?text=${username.charAt(0)}`;
            
            const card = createUserCard(
                username,
                avatar,
                'Sent you a friend request',
                true
            );
            container.appendChild(card);
        });
        
        const divider = document.createElement('hr');
        divider.style.margin = '2rem 0';
        divider.style.borderColor = '#333';
        container.appendChild(divider);
    }
    
    // 2. Show all users header
    const usersHeader = document.createElement('h3');
    usersHeader.style.marginBottom = '1rem';
    usersHeader.textContent = 'All Users';
    container.appendChild(usersHeader);
    
    // 3. Show all users
    users.forEach(user => {
        // Skip users that are already shown in pending requests
        if (pendingUsernames.includes(user.username)) {
            return;
        }
        
        const isSentRequest = sentRequests.includes(user.username);
        
        let status = 'Active user';
        let action = 'Add Friend';
        let onClick = `sendFriendRequest('${user.username}')`;
        let btnClass = 'friend-btn';
        
        if (user.status === 'friend') {
            status = 'Friend';
            action = 'Friends';
            onClick = `removeFriend('${user.username}')`;
            btnClass += ' friend';
        } else if (isSentRequest) {
            status = 'Request sent';
            action = 'Cancel Request';
            onClick = `cancelFriendRequest('${user.username}')`;
            btnClass += ' pending';
        }
        
        const card = createUserCard(
            user.username,
            user.avatar,
            status,
            false,
            action,
            onClick,
            btnClass
        );
        
        container.appendChild(card);
    });
    
    contentArea.appendChild(container);
}

    function createUserCard(username, avatar, status, isPending, action = '', onClick = '', btnClass = '') {
        const card = document.createElement('div');
        card.className = 'user-card';
        if (isPending) card.style.border = '1px solid #1DB954';
        
        // Avatar
        const avatarImg = document.createElement('img');
        avatarImg.src = avatar;
        avatarImg.alt = username;
        avatarImg.className = 'user-avatar-small';
        
        // User info
        const userInfo = document.createElement('div');
        userInfo.className = 'user-info';
        
        const name = document.createElement('div');
        name.className = 'user-name';
        name.textContent = username;
        
        const statusEl = document.createElement('div');
        statusEl.className = 'user-status';
        statusEl.textContent = status;
        if (isPending) statusEl.style.color = '#1DB954';
        
        userInfo.appendChild(name);
        userInfo.appendChild(statusEl);
        
        // Action buttons
        const actionContainer = document.createElement('div');
        
        if (isPending) {
            // Pending request card with Accept/Reject buttons
            actionContainer.style.display = 'flex';
            actionContainer.style.gap = '0.5rem';
            
            const acceptBtn = document.createElement('button');
            acceptBtn.className = 'friend-btn';
            acceptBtn.textContent = 'Accept';
            acceptBtn.onclick = () => acceptFriendRequest(username);
            
            const rejectBtn = document.createElement('button');
            rejectBtn.className = 'friend-btn pending';
            rejectBtn.textContent = 'Reject';
            rejectBtn.onclick = () => rejectFriendRequest(username);
            
            actionContainer.appendChild(acceptBtn);
            actionContainer.appendChild(rejectBtn);
        } else if (action) {
            // Regular user card with action button
            const actionBtn = document.createElement('button');
            actionBtn.className = btnClass;
            actionBtn.textContent = action;
            if (onClick) actionBtn.onclick = new Function(onClick);
            actionContainer.appendChild(actionBtn);
        }
        
        // Assemble card
        card.appendChild(avatarImg);
        card.appendChild(userInfo);
        card.appendChild(actionContainer);
        
        return card;
    }

async function debugCheckFriendsSorting() {
    try {
        const response = await fetch('http://localhost:18080/api/friends', {
            headers: {
                'Authorization': localStorage.getItem('authToken')
            }
        });
        
        const data = await response.json();
        
        if (data.success) {
            console.log('=== Friends List Debug ===');
            console.log('Current user:', localStorage.getItem('username'));
            console.log('Number of friends:', data.friends.length);
            console.log('Friends in order returned by API:', data.friends);
            
            // Check if sorted alphabetically
            const sortedFriends = [...data.friends].sort((a, b) => a.localeCompare(b));
            const isSorted = JSON.stringify(data.friends) === JSON.stringify(sortedFriends);
            
            console.log('Expected alphabetical order:', sortedFriends);
            console.log('Is correctly sorted:', isSorted);
            
            if (!isSorted) {
                console.log('WARNING: Friends are NOT in alphabetical order!');
                for (let i = 0; i < data.friends.length; i++) {
                    if (data.friends[i] !== sortedFriends[i]) {
                        console.log(`Mismatch at index ${i}: got "${data.friends[i]}", expected "${sortedFriends[i]}"`);
                    }
                }
            }
            console.log('========================');
        }
    } catch (error) {
        console.error('Debug error:', error);
    }
}

// Call this function in the console or add a button to trigger it

        async function cancelFriendRequest(receiver) {
    try {
        const response = await fetch('http://localhost:18080/api/friend-request/cancel', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': localStorage.getItem('authToken')
            },
            body: JSON.stringify({ receiver })
        });
        
        const data = await response.json();
        
        if (data.success) {
            alert('Friend request canceled!');
            loadAllUsers(); // Refresh the list
        } else {
            alert(data.message || 'Failed to cancel friend request');
        }
    } catch (error) {
        console.error('Cancel request error:', error);
        alert('Network error. Please try again.');
    }
}

        async function acceptFriendRequest(sender) {
            try {
                const response = await fetch('http://localhost:18080/api/friend-request/accept', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': localStorage.getItem('authToken')
                    },
                    body: JSON.stringify({ sender })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('Friend request accepted!');
                    loadAllUsers();
                    loadFriends();
                } else {
                    alert(data.message || 'Failed to accept friend request');
                }
            } catch (error) {
                console.error('Accept request error:', error);
                alert('Network error. Please try again.');
            }
        }

        async function rejectFriendRequest(sender) {
            try {
                const response = await fetch('http://localhost:18080/api/friend-request/reject', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': localStorage.getItem('authToken')
                    },
                    body: JSON.stringify({ sender })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('Friend request rejected');
                    loadAllUsers();
                } else {
                    alert(data.message || 'Failed to reject friend request');
                }
            } catch (error) {
                console.error('Reject request error:', error);
                alert('Network error. Please try again.');
            }
        }

        async function sendFriendRequest(receiver) {
            try {
                const response = await fetch('http://localhost:18080/api/friend-request/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': localStorage.getItem('authToken')
                    },
                    body: JSON.stringify({ receiver })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('Friend request sent!');
                    loadAllUsers(); // Refresh the list
                } else {
                    alert(data.message || 'Failed to send friend request');
                }
            } catch (error) {
                console.error('Friend request error:', error);
                alert('Network error. Please try again.');
            }
        }

        async function removeFriend(friend) {
            if (!confirm(`Remove ${friend} from your friends?`)) return;
            
            try {
                const response = await fetch('http://localhost:18080/api/friends/remove', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': localStorage.getItem('authToken')
                    },
                    body: JSON.stringify({ friend })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('Friend removed');
                    loadAllUsers();
                    loadFriends();
                } else {
                    alert(data.message || 'Failed to remove friend');
                }
            } catch (error) {
                console.error('Remove friend error:', error);
                alert('Network error. Please try again.');
            }
        }

        async function loadFriends() {
            try {
                const response = await fetch('http://localhost:18080/api/friends', {
                    headers: {
                        'Authorization': localStorage.getItem('authToken')
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const friendsList = document.getElementById('friendsList');
                    
                    if (data.friends.length === 0) {
                        friendsList.innerHTML = '<p style="color: #888; font-size: 0.9rem;">No friends yet</p>';
                    } else {
                        let html = '';
                        data.friends.forEach(friend => {
                            html += `
                                <div class="user-card" style="padding: 0.75rem; margin-bottom: 0.5rem;">
                                    <img src="https://via.placeholder.com/150/1DB954/FFFFFF?text=${friend.charAt(0)}" 
                                         alt="${friend}" class="user-avatar-small" style="width: 40px; height: 40px;">
                                    <div class="user-info">
                                        <div class="user-name" style="font-size: 0.9rem;">${friend}</div>
                                    </div>
                                </div>
                            `;
                        });
                        friendsList.innerHTML = html;
                    }
                }
            } catch (error) {
                console.error('Load friends error:', error);
            }
        }

        async function loadFriendSuggestions() {
            try {
                const response = await fetch('http://localhost:18080/api/friends/suggestions', {
                    headers: {
                        'Authorization': localStorage.getItem('authToken')
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const suggestionsDiv = document.getElementById('friendSuggestions');
                    
                    if (data.suggestions.length === 0) {
                        suggestionsDiv.innerHTML = '<p style="color: #888; font-size: 0.9rem;">No suggestions available</p>';
                    } else {
                        let html = '';
                        data.suggestions.slice(0, 5).forEach(suggestion => {
                            html += `
                                <div class="menu-item" onclick="sendFriendRequest('${suggestion}')" style="cursor: pointer;">
                                    <span>${suggestion}</span>
                                </div>
                            `;
                        });
                        suggestionsDiv.innerHTML = html;
                    }
                }
            } catch (error) {
                console.error('Load suggestions error:', error);
            }
        }

        function showHome() {
            loadAllUsers();
            // Update active menu
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');
        }

        function showFriends() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = '<h2>Your Friends</h2>';
            
            // Update active menu
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');
            
            // Load and display friends
            loadFriendsPage();
        }

        async function loadFriendsPage() {
            try {
                const response = await fetch('http://localhost:18080/api/friends', {
                    headers: {
                        'Authorization': localStorage.getItem('authToken')
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const contentArea = document.getElementById('contentArea');
                    let html = '<h2>Your Friends</h2><div class="users-list">';
                    
                    if (data.friends.length === 0) {
                        html += '<p style="color: #888; text-align: center;">You have no friends yet. Start by searching for users!</p>';
                    } else {
                        data.friends.forEach(friend => {
                            html += `
                                <div class="user-card">
                                    <img src="https://via.placeholder.com/150/1DB954/FFFFFF?text=${friend.charAt(0)}" 
                                         alt="${friend}" class="user-avatar-small">
                                    <div class="user-info">
                                        <div class="user-name">${friend}</div>
                                        <div class="user-status">Friend</div>
                                    </div>
                                    <button class="friend-btn friend" onclick="removeFriend('${friend}')">Remove Friend</button>
                                </div>
                            `;
                        });
                    }
                    
                    html += '</div>';
                    contentArea.innerHTML = html;
                }
            } catch (error) {
                console.error('Load friends page error:', error);
            }
        }

        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('username');
            localStorage.removeItem('userAvatar');
            location.reload();
        }

        // Add event listener for Enter key on search input
        document.getElementById('userSearchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchUsers();
            }
        });

        // Debug function to check all users
        async function debugUsers() {
            try {
                const response = await fetch('http://localhost:18080/api/debug/users');
                const data = await response.json();
                console.log('All registered users:', data);
            } catch (error) {
                console.error('Debug error:', error);
            }
        }

        // Debug function to check friend requests
        async function debugFriendRequests() {
            try {
                const response = await fetch('http://localhost:18080/api/debug/friend-requests');
                const data = await response.json();
                console.log('All friend requests:', data);
            } catch (error) {
                console.error('Debug error:', error);
            }
        }

        // Refresh data periodically
        setInterval(() => {
            if (authToken && currentUser) {
                loadAllUsers();
                loadFriends();
                loadFriendSuggestions();
            }
        }, 5000); // Refresh every 5 seconds
    </script>
</body>
</html>
